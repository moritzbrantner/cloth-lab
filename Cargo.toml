[package]
name = "cloth-lab"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"
description = "Deterministic cloth and textile simulation experiments"

[lib]
name = "cloth_lab"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
gltf = { version = "1.4.1", default-features = false, features = ["utils"] }
spatial-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "ee7587f793fd67d2846c94572d48c0e1a3273caf" }
three-d-animation = { git = "https://github.com/moritzbrantner/3d-lab", rev = "df52c324a5692d04d2016d8a29f5bc4368e4aac0", package = "three-d-animation" }
three-d-core = { git = "https://github.com/moritzbrantner/3d-lab", rev = "df52c324a5692d04d2016d8a29f5bc4368e4aac0", package = "three-d-core" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
