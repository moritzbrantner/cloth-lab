[package]
name = "cloth-lab"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"
description = "Deterministic cloth and textile simulation experiments"

[lib]
name = "cloth_lab"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
gltf = { version = "1.4.1", default-features = false, features = ["utils"] }
spatial-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "166eb4d8a131bbca9afb154fd04133bbcf82223a" }
three-d-animation = { git = "https://github.com/moritzbrantner/3d-lab", rev = "2ef8cc9488d5ad0e3bf87cde5e09674ac6cee4d9", package = "three-d-animation" }
three-d-core = { git = "https://github.com/moritzbrantner/3d-lab", rev = "2ef8cc9488d5ad0e3bf87cde5e09674ac6cee4d9", package = "three-d-core" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
