[package]
name = "cloth-lab"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"
description = "Deterministic cloth and textile simulation experiments"

[lib]
name = "cloth_lab"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
gltf = { version = "1.4.1", default-features = false, features = ["utils"] }
spatial-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "89731e09e2cd639edcd04b88f97c1c76e4c2c5cb" }
three-d-animation = { git = "https://github.com/moritzbrantner/3d-lab", rev = "77122d13dbd06789dcce05473b0528e61ad69a44", package = "three-d-animation" }
three-d-core = { git = "https://github.com/moritzbrantner/3d-lab", rev = "77122d13dbd06789dcce05473b0528e61ad69a44", package = "three-d-core" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
