[package]
name = "cloth-lab"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"
description = "Deterministic cloth and textile simulation experiments"

[lib]
name = "cloth_lab"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
gltf = { version = "1.4.1", default-features = false, features = ["utils"] }
spatial-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "980091094a9826167a98b96781126595fbea5076" }
three-d-animation = { git = "https://github.com/moritzbrantner/3d-lab", rev = "f2acf53d44a1f0339749404a8b38cfa65834fdde", package = "three-d-animation" }
three-d-core = { git = "https://github.com/moritzbrantner/3d-lab", rev = "f2acf53d44a1f0339749404a8b38cfa65834fdde", package = "three-d-core" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
