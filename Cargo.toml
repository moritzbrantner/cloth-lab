[package]
name = "cloth-lab"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"
description = "Deterministic cloth and textile simulation experiments"

[lib]
name = "cloth_lab"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
gltf = { version = "1.4.1", default-features = false, features = ["utils"] }
spatial-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "3aaef5bb036c4568aea3091945e90266981fd9ca" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
