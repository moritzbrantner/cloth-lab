name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98
        with:
          targets: wasm32-unknown-unknown
      - name: Generate deterministic cloth snapshots
        run: cargo run --locked --release --example pages_snapshot > site/frames.json
      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - name: Build interactive cloth WebAssembly
        run: |
          cargo build --locked --release --target wasm32-unknown-unknown
          wasm-bindgen \
            --target web \
            --out-dir site/pkg \
            --out-name cloth_lab \
            target/wasm32-unknown-unknown/release/cloth_lab.wasm
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
