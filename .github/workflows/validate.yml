name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98
        with:
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Check browser WebAssembly target
        run: cargo check --locked --target wasm32-unknown-unknown
      - name: Generate Pages snapshots
        run: |
          cargo run --locked --example pages_snapshot > /tmp/cloth-lab-frames.json
          test -s /tmp/cloth-lab-frames.json
      - name: Check Pages JavaScript
        run: |
          node --check site/app.js
          node --check site/obstacle.js
